name: GraphQL BOLA Security Audit & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  bola-audit:
    name: Differential BOLA Audit & SARIF Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Execute CCNS CI BOLA Security Gate
        run: |
          python scripts/ci_security_gate.py --output-sarif ccns_bola_findings.sarif

      - name: Upload SARIF Security Findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ccns_bola_findings.sarif
          category: ccns-graphql-bola-shield

      - name: Archive Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccns-bola-security-artifacts
          path: |
            ccns_bola_findings.sarif
